on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

name: CI

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        name: Audit Rust Dependencies
        with:
          denyWarnings: true
          createIssues: false

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

      - name: cargo-about cache restore
        id: cargo_about_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-about
          key: ${{ runner.os }}-cargo-about

      - run: cargo install --locked cargo-about
        if: steps.cargo_about_cache_restore.outputs.cache-hit != 'true'

      - name: cargo-about cache save
        id: cargo_about_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.cargo_about_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-about
          key: ${{ runner.os }}-cargo-about

      - name: cargo-about generate licenses
        run: cargo about generate --workspace about.hbs > doc/src/licenses.html

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - run: cargo fmt --all -- --check

  docs_and_spell_check:
    name: Docs and Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check spelling
        uses: crate-ci/typos@master

      - run: cargo doc --no-deps

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - name: "Run clippy (client side graphviz)"
        run: |
          cargo clippy --workspace -- -D warnings

  build_and_test_linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: "Build and test"
        run: cargo test --workspace

  build_playground_linux_cargo_leptos:
    name: Build Playground (Linux, cargo-leptos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: cargo-leptos cache restore
        id: cargo_leptos_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: ${{ runner.os }}-cargo-leptos

      - run: cargo install cargo-leptos
        if: steps.cargo_leptos_cache_restore.outputs.cache-hit != 'true'

      - name: cargo-leptos cache save
        id: cargo_leptos_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.cargo_leptos_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: ${{ runner.os }}-cargo-leptos

      - name: "Build playground"
        working-directory: ./playground
        run: cargo leptos build -v

  build_playground_linux_trunk:
    name: Build Playground (Linux, trunk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: trunk cache restore
        id: trunk_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/trunk
          key: ${{ runner.os }}-trunk

      - run: cargo install trunk
        if: steps.trunk_cache_restore.outputs.cache-hit != 'true'

      - name: trunk cache save
        id: trunk_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.trunk_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/trunk
          key: ${{ runner.os }}-trunk

      - name: "Build playground"
        working-directory: ./playground
        run: trunk build -v

  build_and_test_windows:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Prepare symlink configuration
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: "Build and test"
        run: cargo test --workspace

  build_playground_windows:
    name: Build Playground (Windows, cargo-leptos)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Prepare symlink configuration
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: cargo-leptos cache restore
        id: cargo_leptos_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: ${{ runner.os }}-cargo-leptos

      - run: cargo install cargo-leptos
        if: steps.cargo_leptos_cache_restore.outputs.cache-hit != 'true'

      - name: cargo-leptos cache save
        id: cargo_leptos_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.cargo_leptos_cache_restore.outputs.cache-hit != 'true'
        with:
          path: 'C:\Users\runneradmin\.cargo\bin\cargo-leptos.exe'
          key: ${{ runner.os }}-cargo-leptos

      - name: "Build playground"
        working-directory: ./playground
        run: cargo leptos build -v
